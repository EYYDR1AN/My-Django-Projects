<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Delete Department</title>
</head>
<body>
    <div>
        <h2>Delete Department</h2>
        <p>Are you sure you want to delete <strong>{{ department.department_name }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Delete</button>
            <a href="{% url 'department_list' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
