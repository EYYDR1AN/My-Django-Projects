<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Department</title>
</head>
<body>
    <div>
        <h2>Edit Department</h2>
        <form method="post">
            {% csrf_token %}
            <p>
                <label>Code:</label><br>
                <input type="text" name="department_code" value="{{ department.department_code }}" required>
            </p>
            <p>
                <label>Department Name:</label><br>
                <input type="text" name="department_name" value="{{ department.department_name }}" required>
            </p>
            <p>
                <label>Department Head:</label><br>
                <input type="text" name="department_head" value="{{ department.department_head }}" required>
            </p>
            <p>
                <label>Office Location:</label><br>
                <input type="text" name="office_location" value="{{ department.office_location }}" required>
            </p>
            <p>
                <label>Date Established:</label><br>
                <input type="date" name="date_established" value="{{ department.date_established|date:'Y-m-d' }}" required>
            </p>
            <button type="submit">Update</button>
            <a href="{% url 'department_list' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
