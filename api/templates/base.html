<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Famous Destinations{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #e0e0e0;
            background: #0f0f0f;
        }

      
        nav {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #00d4ff;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            align-items: center;
        }

        nav a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        nav a:first-child {
            font-size: 1.5rem;
            margin-right: 2rem;
            color: #00d4ff;
        }

        nav a:hover {
            color: #00ffff;
        }

       
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    
    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
             <li><a href="{% url 'skills' %}">Skills</a></li>
            <li><a href="{% url 'gallery' %}">Gallery</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
        </ul>
    </nav>

    
    <main>
        {% block content %}{% endblock %}
    </main>

   
    <footer>
        <p>&copy; 2026 Famous Destinations. Explore the world with us!</p>
    </footer>
</body>
</html>
