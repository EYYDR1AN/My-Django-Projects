{% extends "base.html" %}

{% block content %}

<style>

    /* =========================
       DELETE SKILL CONTAINER
    ========================= */

    .add-skill-container {
        max-width: 900px;
        margin: 55px auto;
        padding: 0 30px;
    }


    /* =========================
       SECTION LABEL
    ========================= */

    .section-label {
        color: #00e5ff;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }


    /* =========================
       TITLE
    ========================= */

    .add-skill-container h1 {
        color: #ffffff;
        font-size: 34px;
        margin-bottom: 12px;
    }


    /* =========================
       FORM CARD
    ========================= */

    .skill-form-card {
        max-width: 850px;

        background: #111824;

        border: 1px solid #3a2630;

        border-radius: 7px;

        padding: 35px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }


    /* =========================
       WARNING MESSAGE
    ========================= */

    .warning-message {
        color: #cbd3dc;

        font-family: "Courier New", monospace;

        font-size: 13px;

        line-height: 1.6;

        margin: 0 0 25px 0;
    }


    /* =========================
       SKILL PREVIEW
    ========================= */

    .skill-preview {

        background: #080c12;

        border: 1px solid #263346;

        border-radius: 5px;

        padding: 22px;

        margin-bottom: 28px;
    }


    /* Skill name */

    .skill-preview strong {

        display: block;

        color: #ffffff;

        font-family: "Courier New", monospace;

        font-size: 20px;

        margin-bottom: 10px;
    }


    /* Category */

    .skill-preview span {

        display: inline-block;

        color: #00e5ff;

        font-family: "Courier New", monospace;

        font-size: 11px;

        border: 1px solid #1d5965;

        border-radius: 3px;

        padding: 5px 9px;

        margin-bottom: 17px;
    }


    /* Description */

    .skill-preview p {

        color: #9ba6b4;

        font-family: "Courier New", monospace;

        font-size: 12px;

        line-height: 1.6;

        margin: 0;

        padding-top: 15px;

        border-top: 1px solid #1d2735;
    }


    /* =========================
       BUTTON AREA
    ========================= */

    .buttons {

        display: flex;

        align-items: center;

        gap: 12px;
    }


    .buttons form {
        margin: 0;
    }


    /* =========================
       DELETE BUTTON
    ========================= */

    .delete-button {

        background: #d94b5b;

        color: #ffffff;

        border: none;

        border-radius: 5px;

        padding: 13px 22px;

        font-family: "Courier New", monospace;

        font-size: 11px;

        font-weight: bold;

        letter-spacing: 1px;

        cursor: pointer;

        transition: 0.2s ease;
    }


    .delete-button:hover {

        background: #ff5c6c;

        transform: translateY(-1px);

        box-shadow: 0 5px 15px rgba(217, 75, 91, 0.2);
    }


    /* =========================
       CANCEL BUTTON
    ========================= */

    .cancel-button {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        background: #182131;

        color: #8994a3;

        border: 1px solid #26384d;

        border-radius: 5px;

        padding: 12px 22px;

        font-family: "Courier New", monospace;

        font-size: 11px;

        font-weight: bold;

        letter-spacing: 1px;

        transition: 0.2s ease;
    }


    .cancel-button:hover {

        color: #00e5ff;

        border-color: #00e5ff;

        background: #111b2a;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        .add-skill-container {

            margin: 40px auto;

            padding: 0 20px;
        }


        .add-skill-container h1 {

            font-size: 28px;
        }


        .skill-form-card {

            padding: 25px;
        }


        .buttons {

            flex-direction: column;

            align-items: stretch;
        }


        .delete-button,
        .cancel-button {

            width: 100%;

            text-align: center;
        }

    }

</style>


<div class="add-skill-container">


    <!-- =========================
         SECTION HEADER
    ========================= -->

    <div class="section-label">
        ■ SYSTEM MODULE
    </div>


    <h1>
        Delete Skill
    </h1>


    <!-- =========================
         DELETE CARD
    ========================= -->

    <div class="skill-form-card">


        <!-- WARNING -->

        <p class="warning-message">
            Are you sure you want to delete this skill?
        </p>


        <!-- =========================
             SKILL PREVIEW
        ========================= -->

        <div class="skill-preview">


            <!-- SKILL NAME -->

            <strong>
                {{ skill.skill_name }}
            </strong>


            <!-- CATEGORY -->

            <span>
                {{ skill.category }}
            </span>


            <!-- DESCRIPTION -->

            <p>
                {{ skill.description }}
            </p>


        </div>


        <!-- =========================
             DELETE FORM
        ========================= -->

        <form method="POST">

            {% csrf_token %}


            <div class="buttons">


                <!-- DELETE -->

                <button
                    type="submit"
                    class="delete-button"
                >
                    DELETE SKILL
                </button>


                <!-- CANCEL -->

                <a
                    href="{% url 'skills' %}"
                    class="cancel-button"
                >
                    CANCEL
                </a>


            </div>

        </form>


    </div>

</div>

{% endblock %}
